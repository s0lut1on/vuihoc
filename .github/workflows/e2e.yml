name: E2E Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'math-app/frontend/**'
      - 'math-app/backend/**'
      - 'math-app/e2e/**'
      - 'math-app/docker-compose*.yml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  e2e-test:
    name: Full stack E2E test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build services locally with cache
        run: |
          cd math-app
          docker compose up --build -d
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          JWT_SECRET: test-secret-for-e2e-only

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8082/ > /dev/null 2>&1; then
              echo "Frontend ready"
              break
            fi
            sleep 1
          done

      - name: Setup Node for E2E
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          cd math-app/e2e
          npm ci
          npx playwright install chromium

      - name: Run E2E tests
        run: |
          cd math-app/e2e
          npx playwright test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: math-app/e2e/playwright-report/
          retention-days: 3

      - name: Cleanup
        if: always()
        run: cd math-app && docker compose down
