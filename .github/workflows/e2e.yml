name: math-app-e2e
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: cd math-app/e2e && npm ci && npx playwright install chromium
      - name: Start services
        run: cd math-app && make docker-dev
      - name: Wait for services
        run: npx wait-on http://localhost:8082 --timeout 60000
      - name: Run E2E tests
        run: cd math-app/e2e && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: math-app/e2e/playwright-report/
