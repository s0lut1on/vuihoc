name: Build & Deploy to VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'math-app/frontend/**'
            backend:
              - 'math-app/backend/**'
            infra:
              - 'math-app/docker-compose*.yml'
              - '.github/workflows/deploy.yml'

  build-flutter:
    name: Build Flutter Web
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Flutter Web
        uses: docker/build-push-action@v5
        with:
          context: ./math-app/frontend
          platforms: linux/amd64
          push: true
          build-args: |
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/flutter-web:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/flutter-web:latest
          cache-from: type=gha,scope=flutter-web
          cache-to: type=gha,mode=max,scope=flutter-web

  build-backend:
    name: Build Backend Services
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth, user, content, progress, notification, media, question_bank]
      max-parallel: 4
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./math-app/backend
          file: ./math-app/backend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-language:
    name: Build Language Service (Python)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push language-service
        uses: docker/build-push-action@v5
        with:
          context: ./math-app/backend/language
          file: ./math-app/backend/language/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/language:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/language:latest
          cache-from: type=gha,scope=language
          cache-to: type=gha,mode=max,scope=language

  deploy:
    name: Deploy to VPS
    needs: [build-flutter, build-backend, build-language]
    if: |
      github.ref == 'refs/heads/main' &&
      always() &&
      (needs.build-flutter.result == 'success' || needs.build-flutter.result == 'skipped') &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-language.result == 'success' || needs.build-language.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd ~/math-app/math-app
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            IMAGE_TAG="${{ github.sha }}" docker compose -f docker-compose.ghcr.yml pull
            IMAGE_TAG="${{ github.sha }}" docker compose -f docker-compose.ghcr.yml up -d --no-build
            sleep 15
            ./scripts/health-check.sh
