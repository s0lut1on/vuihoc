name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Flutter Web
        run: |
          docker build -t ghcr.io/${{ github.repository }}/flutter-web:${{ github.sha }} ./frontend
          docker push ghcr.io/${{ github.repository }}/flutter-web:${{ github.sha }}

      - name: Build and push Rust backend services
        run: |
          for svc in auth user content progress notification media; do
            docker build \
              --build-arg SERVICE_NAME=$svc \
              -t ghcr.io/${{ github.repository }}/$svc:${{ github.sha }} \
              -f backend/Dockerfile backend
            docker push ghcr.io/${{ github.repository }}/$svc:${{ github.sha }}
          done
