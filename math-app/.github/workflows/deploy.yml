name: Build & Deploy to VPS

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build images & push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Flutter Web
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/flutter-web:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/flutter-web:latest

      - name: Build and push backend services
        run: |
          for svc in auth user content progress notification media question_bank; do
            docker buildx build \
              --platform linux/amd64 \
              --build-arg SERVICE_NAME="${svc}" \
              --file backend/Dockerfile \
              --tag "${{ env.IMAGE_PREFIX }}/${svc}:${{ github.sha }}" \
              --tag "${{ env.IMAGE_PREFIX }}/${svc}:latest" \
              --push ./backend
          done

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd ~/math-app/math-app
            # Pull new images via compose, then restart services
            docker compose -f docker-compose.ghcr.yml pull
            IMAGE_TAG="${{ github.sha }}" docker compose -f docker-compose.ghcr.yml up -d
            # Wait for DBs and health-check
            sleep 20
            ./scripts/health-check.sh