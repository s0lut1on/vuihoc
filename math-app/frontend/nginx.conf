server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    add_header Cross-Origin-Opener-Policy "unsafe-none" always;
    add_header Cross-Origin-Embedder-Policy "unsafe-none" always;

    # Gzip all text-ish responses. Cuts main.dart.js from 3.6MB to ~1MB
    # and canvas/text responses proportionally. Static asset Cache-Control
    # headers further down still apply.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # HTML — short cache so Cloudflare's edge caches the page (50ms TTFB
    # vs 400ms+ from origin). The Flutter app handles its own version
    # invalidation via ?v= on main.dart.js / flutter_bootstrap.js, so a
    # stale HTML is fine for 5 min — the versioned assets will force the
    # new bundle.
    location = /index.html {
        add_header Cache-Control "public, max-age=300" always;
        add_header Vary "Accept-Encoding" always;
        try_files $uri =404;
    }

    # SPA fallback — must be fresh so app updates deploy immediately
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # Service worker must always be fresh so cache invalidation works
    location ~ ^/flutter_service_worker\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Bootstrap script — must be fresh so loader logic updates deploy
    location ~ ^/flutter_bootstrap\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Static assets: hashed in filename by Flutter — cache forever
    location ~* \.(js|wasm|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|json)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        try_files $uri =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
