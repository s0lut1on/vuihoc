name: math_app
version: 1.0.0+1
publish_to: none
description: Math learning app for kids ages 5-7 (Vietnam market)

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.7.0
  google_sign_in: ^6.2.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  connectivity_plus: ^6.1.0
  audioplayers: ^6.1.0
  confetti: ^0.8.0
  intl: ^0.20.2
  go_router: ^14.2.3
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  google_fonts: ^6.2.1
  characters: ^1.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/audio/vi/
    - assets/audio/en/
    - assets/fonts/
    - assets/pricing.json
