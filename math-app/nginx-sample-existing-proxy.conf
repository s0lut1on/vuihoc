# Nginx site config for math-app when an existing reverse proxy already occupies 80/443
# Place this in /etc/nginx/sites-available/math-app and symlink to sites-enabled
# Assumes existing Nginx handles SSL termination (Let's Encrypt or Cloudflare)

upstream math_flutter {
    server 127.0.0.1:8082;
}

upstream math_auth {
    server 127.0.0.1:3001;
}

upstream math_users {
    server 127.0.0.1:3002;
}

upstream math_content {
    server 127.0.0.1:3003;
}

upstream math_progress {
    server 127.0.0.1:3004;
}

upstream math_notifications {
    server 127.0.0.1:3005;
}

upstream math_media {
    server 127.0.0.1:3006;
}

upstream math_questions {
    server 127.0.0.1:3007;
}

server {
    listen 443 ssl;
    server_name yourdomain.com www.yourdomain.com;

    # SSL certificates managed by your existing Let's Encrypt setup or Cloudflare
    ssl_certificate /path/to/your/cert.pem;
    ssl_certificate_key /path/to/your/key.pem;

    # Flutter web app (SPA)
    location / {
        proxy_pass http://math_flutter;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth service
    location /api/auth/ {
        proxy_pass http://math_auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Users service
    location /api/users/ {
        proxy_pass http://math_users/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Content service
    location /api/content/ {
        proxy_pass http://math_content/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Progress service
    location /api/progress/ {
        proxy_pass http://math_progress/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Notifications service
    location /api/notifications/ {
        proxy_pass http://math_notifications/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media service
    location /api/media/ {
        proxy_pass http://math_media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Question bank service
    location /api/questions/ {
        proxy_pass http://math_questions/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP to HTTPS redirect (if your existing Nginx doesn't already handle this globally)
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$server_name$request_uri;
}