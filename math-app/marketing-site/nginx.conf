# nginx config for HocVui marketing site.
# Served as static files. Traefik handles the public-facing TLS.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Emit relative redirects (e.g. "/en/" not "http://sekklings.com/en/")
    # so TLS-terminating proxies (Traefik/Cloudflare) don't downgrade the
    # scheme in Location headers.
    absolute_redirect off;
    port_in_redirect off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml+rss image/svg+xml;
    gzip_proxied any;

    # Security headers (Traefik adds CSP via middleware too; nginx sets basics)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Cache rules
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Brand assets
    location /brand/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # sitemap + robots + manifest
    location = /sitemap.xml       { return 301 /sitemap-index.xml; }
    location = /sitemap-index.xml { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
    location = /robots.txt        { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }

    # Astro static output: pretty URLs.
    # Fall through to /404.html (with 404 status) instead of /index.html
    # to avoid soft-404s (duplicate-content SEO penalty).
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Internal 404 handler — always return 404 status, never 200.
    location = /404.html {
        internal;
        return 404;
    }

    # HTML: short cache so deploys show up fast (Cloudflare + browser)
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=60, must-revalidate";
    }

    # .well-known (security.txt)
    location /.well-known/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA fallback for the /app subpath if Traefik fails through (defense in depth)
    location /app/ {
        return 301 /app;
    }

    # Health
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
