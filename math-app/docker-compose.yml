services:
  traefik:
    image: traefik:latest
    ports:
      - "8082:80"
      - "8083:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    restart: unless-stopped

  flutter-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flutter-web.rule=Host(`localhost`) && PathPrefix(`/app`)"
      - "traefik.http.routers.flutter-web.priority=50"
      - "traefik.http.middlewares.flutter-strip.stripprefix.prefixes=/app"
      - "traefik.http.middlewares.flutter-strip.stripprefix.forceSlash=false"
      - "traefik.http.middlewares.flutter-coop.headers.customResponseHeaders.Cross-Origin-Opener-Policy=unsafe-none"
      - "traefik.http.routers.flutter-web.middlewares=flutter-strip,flutter-coop"
    restart: unless-stopped

  marketing-site:
    image: nginx:1.27-alpine
    volumes:
      - ./marketing-site/dist:/usr/share/nginx/html:ro
      - ./marketing-site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.marketing.rule=Host(`localhost`)"
      - "traefik.http.routers.marketing.priority=10"
    restart: unless-stopped

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      - DATABASE_URL=postgresql://umami:umami@umami-db:5432/umami
      - APP_SECRET=dev-secret-change-in-prod
    depends_on:
      - umami-db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.umami.rule=Host(`localhost`) && PathPrefix(`/umami`)"
      - "traefik.http.routers.umami.priority=50"
      - "traefik.http.middlewares.umami-strip.stripprefix.prefixes=/umami"
      - "traefik.http.middlewares.umami-strip.stripprefix.forceSlash=false"
      - "traefik.http.routers.umami.middlewares=umami-strip"
      - "traefik.http.routers.umami-static.rule=Host(`localhost`) && PathPrefix(`/_next`)"
      - "traefik.http.routers.umami-static.priority=50"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"
    restart: unless-stopped

  umami-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth
    environment:
      - PORT=3000
      - DATABASE_URL=${AUTH_DB_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - auth-db
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/auth`)"
    restart: unless-stopped

  user-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user
    environment:
      - PORT=3000
      - DATABASE_URL=${USER_DB_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - user-db
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user.rule=PathPrefix(`/api/users`)"
    restart: unless-stopped

  content-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: content
    environment:
      - PORT=3000
      - DATABASE_URL=${CONTENT_DB_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - content-db
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.content.rule=PathPrefix(`/api/content`)"
    restart: unless-stopped

  progress-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: progress
    environment:
      - PORT=3000
      - DATABASE_URL=${PROGRESS_DB_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - progress-db
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.progress.rule=PathPrefix(`/api/progress`)"
    restart: unless-stopped

  notification-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification
    environment:
      - PORT=3000
      - DATABASE_URL=${NOTIFICATION_DB_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - notification-db
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notification.rule=PathPrefix(`/api/notifications`)"
    restart: unless-stopped

  media-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: media
    environment:
      - PORT=3000
      - DATABASE_URL=${MEDIA_DB_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - media-db
      - redis
      - minio
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.media.rule=PathPrefix(`/api/media`)"
    restart: unless-stopped

  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USER:-auth_user}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS:-auth_pass}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  user-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-user_db}
      POSTGRES_USER: ${USER_DB_USER:-user_user}
      POSTGRES_PASSWORD: ${USER_DB_PASS:-user_pass}
    volumes:
      - user_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  content-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${CONTENT_DB_NAME:-content_db}
      POSTGRES_USER: ${CONTENT_DB_USER:-content_user}
      POSTGRES_PASSWORD: ${CONTENT_DB_PASS:-content_pass}
    volumes:
      - content_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  progress-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${PROGRESS_DB_NAME:-progress_db}
      POSTGRES_USER: ${PROGRESS_DB_USER:-progress_user}
      POSTGRES_PASSWORD: ${PROGRESS_DB_PASS:-progress_pass}
    volumes:
      - progress_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  notification-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notification_db}
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASS:-postgres}
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  media-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${MEDIA_DB_NAME:-media_db}
      POSTGRES_USER: ${MEDIA_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${MEDIA_DB_PASS:-postgres}
    volumes:
      - media_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9002:9000"
    # Console port 9003 intentionally NOT exposed for security
    # Use docker exec to access console if needed:
    # docker exec -it math-app-minio-1 mc alias set local http://localhost:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY}
    restart: unless-stopped

  question-bank-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: question_bank
    environment:
      - PORT=3000
      - DATABASE_URL=${QB_DB_URL}
      - REDIS_URL=redis://redis:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - qb-db
      - redis
    labels:
      - "traefik.enable=true"
      - 'traefik.http.routers.question-bank.rule=PathPrefix(`/api/questions`)'
    restart: unless-stopped

  qb-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${QB_DB_NAME:-qb_db}
      POSTGRES_USER: ${QB_DB_USER:-qb_user}
      POSTGRES_PASSWORD: ${QB_DB_PASS:-qb_pass}
    volumes:
      - qb_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  language-service:
    build:
      context: ./backend/language
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://lang_user:lang_pass@language-db:5432/language_db
      - JWT_SECRET=${JWT_SECRET}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_SECURE=false
      - BASE_URL=http://localhost:8082
    depends_on:
      - language-db
      - minio
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.language.rule=PathPrefix(`/api/language`)"
      - "traefik.http.routers.language.priority=100"
    restart: unless-stopped

  language-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: language_db
      POSTGRES_USER: lang_user
      POSTGRES_PASSWORD: lang_pass
    volumes:
      - language_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  auth_db_data:
  user_db_data:
  content_db_data:
  progress_db_data:
  notification_db_data:
  media_db_data:
  qb_db_data:
  language_db_data:
  minio_data:
  umami_db_data:
