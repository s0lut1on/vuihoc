services:
  traefik:
    image: traefik:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./letsencrypt:/letsencrypt
      - /var/log/traefik:/var/log/traefik
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=false"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Access log: CLF format (Common Log Format) is the default.
      # Rolling daily via logrotate, kept 30 days.
      - "--accesslog=true"
      - "--accesslog.format=clf"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.bufferingsize=100"
    restart: unless-stopped

  www-redirect:
    image: traefik:latest
    command:
      - "--providers.docker=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.www-redirect.rule=Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.www-redirect.entrypoints=websecure"
      - "traefik.http.routers.www-redirect.tls.certresolver=letsencrypt"
      - "traefik.http.routers.www-redirect.priority=200"
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.${DOMAIN}(/.*)?"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://${DOMAIN}$${1}"
      - "traefik.http.routers.www-redirect.middlewares=www-redirect"
    restart: unless-stopped

  language-service:
    build:
      context: ./backend/language
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://lang_user:lang_pass@language-db:5432/language_db
      - JWT_SECRET=${JWT_SECRET}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_SECURE=false
      - BASE_URL=https://${DOMAIN}
    depends_on:
      - language-db
      - minio
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.language.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/language`)"
      - "traefik.http.routers.language.entrypoints=websecure"
      - "traefik.http.routers.language.tls.certresolver=letsencrypt"
      - "traefik.http.routers.language.priority=100"
      - "traefik.http.services.language.loadbalancer.server.port=3000"
    restart: unless-stopped

  language-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: language_db
      POSTGRES_USER: lang_user
      POSTGRES_PASSWORD: lang_pass
    volumes:
      - language_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  flutter-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        APP_VERSION: ${APP_VERSION:-local-dev}
    labels:
      - "traefik.enable=true"
      # Main Flutter app under /app prefix (with strip)
      - "traefik.http.routers.flutter-web.rule=Host(`${DOMAIN}`) && PathPrefix(`/app`)"
      - "traefik.http.routers.flutter-web.entrypoints=websecure"
      - "traefik.http.routers.flutter-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.flutter-web.tls=true"
      - "traefik.http.routers.flutter-web.priority=50"
      - "traefik.http.middlewares.flutter-strip.stripprefix.prefixes=/app"
      - "traefik.http.middlewares.flutter-strip.stripprefix.forceSlash=false"
      - "traefik.http.middlewares.flutter-coop.headers.customResponseHeaders.Cross-Origin-Opener-Policy=unsafe-none"
      # Security headers for Flutter web (CSP omitted — Flutter wasm/eval needs
      # a permissive policy; tracked as a separate task).
      - "traefik.http.middlewares.flutter-headers.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.flutter-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.flutter-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.flutter-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.flutter-headers.headers.permissionsPolicy=geolocation=(), microphone=(), camera=()"
      - "traefik.http.middlewares.flutter-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.routers.flutter-web.middlewares=flutter-strip,flutter-coop,flutter-headers"
      # CanvasKit WASM — Flutter loads from absolute /canvaskit/ path (no /app prefix)
      - "traefik.http.routers.flutter-canvas.rule=Host(`${DOMAIN}`) && PathPrefix(`/canvaskit`)"
      - "traefik.http.routers.flutter-canvas.entrypoints=websecure"
      - "traefik.http.routers.flutter-canvas.tls.certresolver=letsencrypt"
      - "traefik.http.routers.flutter-canvas.tls=true"
      - "traefik.http.routers.flutter-canvas.priority=60"
      - "traefik.http.routers.flutter-canvas.middlewares=flutter-coop,flutter-headers"
      # Flutter manifest + brand assets — loaded by index.html without /app prefix
      - "traefik.http.routers.flutter-assets.rule=Host(`${DOMAIN}`) && PathPrefix(`/brand`)"
      - "traefik.http.routers.flutter-assets.entrypoints=websecure"
      - "traefik.http.routers.flutter-assets.tls.certresolver=letsencrypt"
      - "traefik.http.routers.flutter-assets.tls=true"
      - "traefik.http.routers.flutter-assets.priority=60"
      - "traefik.http.routers.flutter-assets.middlewares=flutter-headers"
    restart: unless-stopped

  marketing-site:
    image: nginx:1.27-alpine
    volumes:
      - ./marketing-site/dist:/usr/share/nginx/html:ro
      - ./marketing-site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.marketing.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.marketing.entrypoints=websecure"
      - "traefik.http.routers.marketing.tls.certresolver=letsencrypt"
      - "traefik.http.routers.marketing.priority=10"
      - "traefik.http.middlewares.marketing-csp.headers.customResponseHeaders.Content-Security-Policy=default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' https://plausible.io https://sekklings.com 'sha256-'; connect-src 'self' https://plausible.io https://sekklings.com"
      - "traefik.http.middlewares.marketing-csp.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.marketing-csp.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.marketing-csp.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.routers.marketing.middlewares=marketing-csp"
    restart: unless-stopped

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASS}@umami-db:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET}
    depends_on:
      - umami-db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.umami.rule=Host(`${DOMAIN}`) && PathPrefix(`/umami`)"
      - "traefik.http.routers.umami.entrypoints=websecure"
      - "traefik.http.routers.umami.tls.certresolver=letsencrypt"
      - "traefik.http.routers.umami.priority=50"
      - "traefik.http.middlewares.umami-strip.stripprefix.prefixes=/umami"
      - "traefik.http.middlewares.umami-strip.stripprefix.forceSlash=false"
      - "traefik.http.routers.umami.middlewares=umami-strip"
      - "traefik.http.routers.umami-static.rule=Host(`${DOMAIN}`) && PathPrefix(`/_next`)"
      - "traefik.http.routers.umami-static.entrypoints=websecure"
      - "traefik.http.routers.umami-static.tls.certresolver=letsencrypt"
      - "traefik.http.routers.umami-static.priority=50"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"
    restart: unless-stopped

  umami-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASS}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth
    environment:
      - PORT=3000
      - DATABASE_URL=${AUTH_DB_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - auth-db
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/auth`)"
      - "traefik.http.routers.auth.entrypoints=websecure"
      - "traefik.http.routers.auth.tls.certresolver=letsencrypt"
      - "traefik.http.routers.auth.priority=100"
    restart: unless-stopped

  user-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user
    environment:
      - PORT=3000
      - DATABASE_URL=${USER_DB_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - user-db
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/users`)"
      - "traefik.http.routers.user.entrypoints=websecure"
      - "traefik.http.routers.user.tls.certresolver=letsencrypt"
      - "traefik.http.routers.user.priority=100"
    restart: unless-stopped

  content-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: content
    environment:
      - PORT=3000
      - DATABASE_URL=${CONTENT_DB_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - content-db
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.content.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/content`)"
      - "traefik.http.routers.content.entrypoints=websecure"
      - "traefik.http.routers.content.tls.certresolver=letsencrypt"
      - "traefik.http.routers.content.priority=100"
    restart: unless-stopped

  progress-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: progress
    environment:
      - PORT=3000
      - DATABASE_URL=${PROGRESS_DB_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - progress-db
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.progress.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/progress`)"
      - "traefik.http.routers.progress.entrypoints=websecure"
      - "traefik.http.routers.progress.tls.certresolver=letsencrypt"
      - "traefik.http.routers.progress.priority=100"
    restart: unless-stopped

  notification-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification
    environment:
      - PORT=3000
      - DATABASE_URL=${NOTIFICATION_DB_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - notification-db
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notification.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/notifications`)"
      - "traefik.http.routers.notification.entrypoints=websecure"
      - "traefik.http.routers.notification.tls.certresolver=letsencrypt"
      - "traefik.http.routers.notification.priority=100"
    restart: unless-stopped

  media-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: media
    environment:
      - PORT=3000
      - DATABASE_URL=${MEDIA_DB_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - media-db
      - redis
      - minio
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.media.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/media`)"
      - "traefik.http.routers.media.entrypoints=websecure"
      - "traefik.http.routers.media.tls.certresolver=letsencrypt"
      - "traefik.http.routers.media.priority=100"
    restart: unless-stopped

  question-bank-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: question_bank
    environment:
      - PORT=3000
      - DATABASE_URL=${QB_DB_URL}
      - REDIS_URL=redis://redis:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - qb-db
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.question-bank.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/questions`)"
      - "traefik.http.routers.question-bank.entrypoints=websecure"
      - "traefik.http.routers.question-bank.tls.certresolver=letsencrypt"
      - "traefik.http.routers.question-bank.priority=100"
    restart: unless-stopped

  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USER:-auth_user}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  user-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-user_db}
      POSTGRES_USER: ${USER_DB_USER:-user_user}
      POSTGRES_PASSWORD: ${USER_DB_PASS}
    volumes:
      - user_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  content-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${CONTENT_DB_NAME:-content_db}
      POSTGRES_USER: ${CONTENT_DB_USER:-content_user}
      POSTGRES_PASSWORD: ${CONTENT_DB_PASS}
    volumes:
      - content_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  progress-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${PROGRESS_DB_NAME:-progress_db}
      POSTGRES_USER: ${PROGRESS_DB_USER:-progress_user}
      POSTGRES_PASSWORD: ${PROGRESS_DB_PASS}
    volumes:
      - progress_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  notification-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notification_db}
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASS}
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  media-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${MEDIA_DB_NAME:-media_db}
      POSTGRES_USER: ${MEDIA_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${MEDIA_DB_PASS}
    volumes:
      - media_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  qb-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${QB_DB_NAME:-qb_db}
      POSTGRES_USER: ${QB_DB_USER:-qb_user}
      POSTGRES_PASSWORD: ${QB_DB_PASS}
    volumes:
      - qb_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  payment-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-payment_db}
      POSTGRES_USER: ${PAYMENT_DB_USER:-payment_user}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASS:-payment_pass}
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  payment-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment
    environment:
      - PORT=3000
      - DATABASE_URL=${PAYMENT_DB_URL}
      - JWT_SECRET=${JWT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - payment-db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.payment.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/payments`)"
      - "traefik.http.routers.payment.entrypoints=websecure"
      - "traefik.http.routers.payment.tls.certresolver=letsencrypt"
      - "traefik.http.routers.payment.priority=100"
      - "traefik.http.services.payment.loadbalancer.server.port=3000"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  auth_db_data:
  user_db_data:
  content_db_data:
  progress_db_data:
  notification_db_data:
  media_db_data:
  qb_db_data:
  language_db_data:
  minio_data:
  umami_db_data:
  payment_db_data:
